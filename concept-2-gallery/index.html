<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Their Day Bouquets — Gallery (Concept 2)</title>
<meta name="description" content="Custom bouquets and flower pop-ups, made by hand in Felton, California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8; --ink:#161616; --muted:#8b8b86; --line:#e6e6e1;
    --accent:#f0a81a;
    --serif:'DM Serif Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
    --gutter:clamp(16px,3vw,40px);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  img{display:block;width:100%;height:100%;object-fit:cover}
  button{font:inherit;color:inherit}

  header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px var(--gutter);background:rgba(250,250,248,.92);backdrop-filter:blur(8px)}
  .brand{font:400 clamp(20px,2.2vw,26px)/1 var(--serif);text-decoration:none;color:inherit}
  .brand i{color:var(--accent)}
  .btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--accent);color:var(--ink)}

  .lede{padding:clamp(40px,8vw,110px) var(--gutter) clamp(30px,5vw,60px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .lede h1{font:400 clamp(40px,7vw,104px)/.98 var(--serif);max-width:12ch}
  .lede h1 i{color:var(--accent)}
  .lede p{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,16px);padding:0 var(--gutter) var(--gutter)}
  .tile{position:relative;aspect-ratio:4/5;overflow:hidden;border:0;padding:0;cursor:zoom-in;background:var(--line)}
  .tile.wide{grid-column:span 2;aspect-ratio:auto}
  .tile img{transition:filter .5s,transform .8s cubic-bezier(.2,.7,.2,1)}
  /* greyscale until hover, on devices that can hover */
  @media(hover:hover){
    .tile img{filter:grayscale(1) contrast(1.02)}
    .tile:hover img,.tile:focus-visible img{filter:none;transform:scale(1.035)}
  }
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tile span{position:absolute;left:12px;bottom:10px;color:#fff;font-size:11px;letter-spacing:.14em;opacity:0;transition:.3s;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .tile:hover span{opacity:1}
  .tile{opacity:0;transform:translateY(18px);transition:opacity .8s,transform .8s}
  .tile.in{opacity:1;transform:none}

  footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px var(--gutter);border-top:1px solid var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  footer a{color:inherit;text-decoration:none}footer a:hover{color:var(--ink)}

  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.tile.wide{grid-column:1/-1;aspect-ratio:4/3}}
  @media(prefers-reduced-motion:reduce){.tile{opacity:1;transform:none;transition:none}}

  /* lightbox */
  #lb{position:fixed;inset:0;z-index:50;background:rgba(250,250,248,.97);display:none;align-items:center;justify-content:center;padding:clamp(56px,8vw,90px) clamp(16px,6vw,90px)}
  #lb.open{display:flex}
  #lb img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
  #lb button{position:absolute;background:none;border:0;cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:14px;color:var(--ink)}
  #lb button:hover{color:var(--accent)}
  #lb .c{top:10px;right:10px}#lb .p{left:6px;top:50%}#lb .n{right:6px;top:50%}
  #lb .k{position:absolute;top:24px;left:var(--gutter);font-size:12px;letter-spacing:.14em;color:var(--muted)}

  /* contact dialog */
  dialog{border:0;border-radius:4px;padding:clamp(32px,6vw,52px);max-width:420px;width:calc(100% - 32px);background:var(--bg);color:var(--ink);text-align:center;margin:auto}
  dialog::backdrop{background:rgba(20,20,20,.5);backdrop-filter:blur(3px)}
  dialog h3{font:400 38px/1 var(--serif);margin-bottom:14px}
  dialog p{color:var(--muted);margin-bottom:26px}
  dialog .x{display:block;margin:20px auto 0;background:none;border:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
</style>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<header>
  <a class="brand" href="#">Make Their Day <i>Bouquets</i></a>
  <button class="btn" id="open-contact">Contact</button>
</header>

<section class="lede">
  <h1>Flowers to <i>make</i> their day.</h1>
  <p>Custom bouquets &amp; pop-ups<br>Felton, CA</p>
</section>

<main class="grid" id="grid">
  <button class="tile" data-i="0"><img src="../assets/img/7160.jpg" alt="Sunflowers and roses in a white bowl on a deck rail"><span>01</span></button>
  <button class="tile" data-i="1"><img src="../assets/img/7145.jpg" loading="lazy" alt="Bouquet arranged in a small pumpkin"><span>02</span></button>
  <button class="tile" data-i="2"><img src="../assets/img/7172.jpg" loading="lazy" alt="Hand-held bouquet wrapped in kraft paper with a sage ribbon"><span>03</span></button>
  <button class="tile wide" data-i="3"><img src="../assets/img/7180.jpg" loading="lazy" alt="Roadside pop-up table with a fresh flowers for sale sign"><span>04</span></button>
  <button class="tile" data-i="4"><img src="../assets/img/7154.jpg" loading="lazy" alt="Roses and daisies in a jar tied with ribbon"><span>05</span></button>
  <button class="tile" data-i="5"><img src="../assets/img/7165.jpg" loading="lazy" alt="Pink gerbera and roses in a bowl by a window"><span>06</span></button>
  <button class="tile" data-i="6"><img src="../assets/img/7195.jpg" loading="lazy" alt="Wrapped bouquets in an enamel bucket"><span>07</span></button>
  <button class="tile" data-i="7"><img src="../assets/img/7167.jpg" loading="lazy" alt="Sunflower and magenta gerbera against white wood"><span>08</span></button>
  <button class="tile" data-i="8"><img src="../assets/img/7162.jpg" loading="lazy" alt="Pink gerbera, roses and chrysanthemums on a deck"><span>09</span></button>
  <button class="tile" data-i="9"><img src="../assets/img/7166.jpg" loading="lazy" alt="Overhead view of a bouquet"><span>10</span></button>
  <button class="tile" data-i="10"><img src="../assets/img/7174.jpg" loading="lazy" alt="Bouquet in kraft paper held over a deck railing"><span>11</span></button>
  <button class="tile" data-i="11"><img src="../assets/img/7163.jpg" loading="lazy" alt="Yellow roses and sunflowers in a window"><span>12</span></button>
  <button class="tile" data-i="12"><img src="../assets/img/7181.jpg" loading="lazy" alt="Pop-up table with pumpkin and bowl arrangements"><span>13</span></button>
  <button class="tile" data-i="13"><img src="../assets/img/7197.jpg" loading="lazy" alt="Close-up of a sunflower and rose arrangement at the pop-up"><span>14</span></button>
</main>

<footer>
  <span>© <span id="yr"></span> Make Their Day Bouquets</span>
  <a href="https://www.instagram.com/maketheirdaybouquets/" target="_blank" rel="noopener">Instagram</a>
</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <span class="k" id="lb-k"></span>
  <button class="c" aria-label="Close">Close</button>
  <button class="p" aria-label="Previous">←</button>
  <img id="lb-img" alt="">
  <button class="n" aria-label="Next">→</button>
</div>

<dialog id="contact">
  <h3>Say hello</h3>
  <p>For custom bouquets and pop-up dates, send us a message.</p>
  <a class="btn" href="https://ig.me/m/maketheirdaybouquets" target="_blank" rel="noopener">Message on Instagram</a>
  <button class="x" data-close>Close</button>
</dialog>

<script>
  document.getElementById('yr').textContent=new Date().getFullYear();
  const tiles=[...document.querySelectorAll('.tile')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  tiles.forEach(t=>io.observe(t));

  const lb=document.getElementById('lb'),lbi=document.getElementById('lb-img'),lbk=document.getElementById('lb-k');
  let cur=0;
  const show=i=>{cur=(i+tiles.length)%tiles.length;const im=tiles[cur].querySelector('img');lbi.src=im.src;lbi.alt=im.alt;lbk.textContent=String(cur+1).padStart(2,'0')+' / '+tiles.length};
  const open=i=>{show(i);lb.classList.add('open');document.body.style.overflow='hidden'};
  const shut=()=>{lb.classList.remove('open');document.body.style.overflow=''};
  tiles.forEach((t,i)=>t.onclick=()=>open(i));
  lb.querySelector('.c').onclick=shut;
  lb.querySelector('.p').onclick=()=>show(cur-1);
  lb.querySelector('.n').onclick=()=>show(cur+1);
  lb.addEventListener('click',e=>{if(e.target===lb)shut()});
  addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')shut();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});

  const dlg=document.getElementById('contact');
  document.getElementById('open-contact').onclick=()=>dlg.showModal();
  dlg.querySelector('[data-close]').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
