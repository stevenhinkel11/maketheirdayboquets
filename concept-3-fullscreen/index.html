<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Their Day Bouquets — Full Bloom (Concept 3)</title>
<meta name="description" content="Custom bouquets and flower pop-ups, made by hand in Felton, California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#17191a; --sage:#8fa392; --cream:#f4efe6; --rose:#e9627f;
    --serif:'Playfair Display',Georgia,serif; --sans:'Work Sans',system-ui,sans-serif;
    --gutter:clamp(18px,3.5vw,48px);
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth;background:var(--night)}
  body{background:var(--night);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  img{display:block;width:100%;height:100%;object-fit:cover}

  /* fixed chrome */
  .top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:20px var(--gutter);pointer-events:none;mix-blend-mode:normal}
  .top>*{pointer-events:auto}
  .brand{font:italic 400 clamp(16px,2vw,22px)/1 var(--serif);color:#fff;text-decoration:none;text-shadow:0 1px 14px rgba(0,0,0,.45)}
  .btn{font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;text-decoration:none;color:#fff;background:rgba(23,25,26,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7);padding:12px 24px;border-radius:999px;transition:.25s;display:inline-block}
  .btn:hover{background:var(--rose);border-color:var(--rose)}
  .btn.big{background:var(--rose);border-color:var(--rose);padding:16px 38px}
  .btn.big:hover{background:var(--cream);color:var(--night);border-color:var(--cream)}

  .count{position:fixed;z-index:20;left:var(--gutter);bottom:22px;font:500 11px var(--sans);letter-spacing:.22em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .hint{position:fixed;z-index:20;right:var(--gutter);bottom:22px;font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.5);transition:opacity .4s}
  .hint.off{opacity:0}

  /* slides */
  .slide{position:relative;height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
  .slide img{position:absolute;inset:0;transform:scale(1.07);transition:transform 2.2s cubic-bezier(.2,.7,.2,1)}
  .slide.on img{transform:scale(1)}
  .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 22%,transparent 70%,rgba(0,0,0,.4));pointer-events:none}

  /* cover */
  .cover::after{background:rgba(10,12,10,.38)}
  .cover .t{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter)}
  .cover h1{font:italic 400 clamp(52px,12vw,180px)/.92 var(--serif);color:#fff}
  .cover p{margin-top:28px;font:500 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#fff}

  /* split slide: two photos side by side on wide screens */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .pair>div{position:relative;overflow:hidden}
  .pair img{transform:scale(1.07);transition:transform 2.2s cubic-bezier(.2,.7,.2,1)}
  .pair.on img{transform:scale(1)}
  .pair::after{display:none}
  @media(max-width:720px){.pair{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

  /* final */
  .end{background:var(--sage);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;padding:0 var(--gutter);color:var(--night)}
  .end::after{display:none}
  .end h2{font:italic 400 clamp(46px,9vw,140px)/.95 var(--serif);color:var(--night)}
  .end small{position:absolute;bottom:22px;left:0;right:0;font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase}
  .end small a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}

  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.slide img,.pair img{transform:none;transition:none}}

  dialog{border:0;border-radius:4px;padding:clamp(32px,6vw,52px);max-width:420px;width:calc(100% - 32px);background:var(--cream);color:var(--night);text-align:center;margin:auto}
  dialog::backdrop{background:rgba(10,12,10,.6);backdrop-filter:blur(3px)}
  dialog h3{font:italic 400 40px/1 var(--serif);margin-bottom:14px}
  dialog p{color:#6b6b63;margin-bottom:26px}
  dialog .x{display:block;margin:20px auto 0;background:none;border:0;font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#6b6b63;cursor:pointer}
</style>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<div class="top">
  <a class="brand" href="#s0">Make Their Day Bouquets</a>
  <button class="btn" data-contact>Contact</button>
</div>
<div class="count" id="count">01 / 08</div>
<div class="hint" id="hint">Scroll ↓</div>

<section class="slide cover on" id="s0">
  <img src="../assets/img/7165.jpg" alt="Pink gerbera and yellow roses in a bowl by a sunlit window" style="object-position:50% 40%">
  <div class="t">
    <h1>Make their<br>day.</h1>
    <p>Custom bouquets &amp; pop-ups · Felton, CA</p>
  </div>
</section>

<section class="slide" id="s1">
  <img src="../assets/img/7160.jpg" loading="lazy" alt="Sunflowers, roses and gerbera in a white bowl on a deck rail" style="object-position:50% 55%">
</section>

<section class="slide pair" id="s2">
  <div><img src="../assets/img/7145.jpg" loading="lazy" alt="Bouquet arranged in a small pumpkin"></div>
  <div><img src="../assets/img/7154.jpg" loading="lazy" alt="Roses and daisies in a jar with white ribbon"></div>
</section>

<section class="slide" id="s3">
  <img src="../assets/img/7172.jpg" loading="lazy" alt="Hand-held bouquet wrapped in kraft paper with sage ribbon" style="object-position:50% 35%">
</section>

<section class="slide" id="s4">
  <img src="../assets/img/7180.jpg" loading="lazy" alt="Roadside pop-up table with a fresh flowers for sale chalkboard" style="object-position:50% 60%">
</section>

<section class="slide pair" id="s5">
  <div><img src="../assets/img/7195.jpg" loading="lazy" alt="Wrapped bouquets in an enamel bucket"></div>
  <div><img src="../assets/img/7167.jpg" loading="lazy" alt="Sunflower and magenta gerbera against white wood"></div>
</section>

<section class="slide" id="s6">
  <img src="../assets/img/7166.jpg" loading="lazy" alt="Overhead view of a bouquet with peach roses and sunflowers" style="object-position:50% 45%">
</section>

<section class="slide end" id="s7">
  <h2>Let’s make<br>someone’s day.</h2>
  <button class="btn big" data-contact>Contact</button>
  <small>© <span id="yr"></span> · <a href="https://www.instagram.com/maketheirdaybouquets/" target="_blank" rel="noopener">@maketheirdaybouquets</a></small>
</section>

<dialog id="contact">
  <h3>Say hello</h3>
  <p>For custom bouquets and pop-up dates, send us a message.</p>
  <a class="btn big" href="https://ig.me/m/maketheirdaybouquets" target="_blank" rel="noopener">Message on Instagram</a>
  <button class="x" data-close>Close</button>
</dialog>

<script>
  document.getElementById('yr').textContent=new Date().getFullYear();
  const slides=[...document.querySelectorAll('.slide')];
  const count=document.getElementById('count'),hint=document.getElementById('hint');
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    e.target.classList.toggle('on',e.isIntersecting);
    if(e.isIntersecting){
      const i=slides.indexOf(e.target);
      count.textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
      count.style.color=e.target.classList.contains('end')?'#17191a':'#fff';
      count.style.textShadow=e.target.classList.contains('end')?'none':'';
      hint.classList.toggle('off',i>0);
    }
  }),{threshold:.55});
  slides.forEach(s=>io.observe(s));

  const go=d=>{const y=scrollY+innerHeight/2;let i=slides.findIndex(s=>y>=s.offsetTop&&y<s.offsetTop+s.offsetHeight);slides[Math.max(0,Math.min(slides.length-1,i+d))].scrollIntoView({behavior:'smooth'})};
  addEventListener('keydown',e=>{
    if(document.getElementById('contact').open)return;
    if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
    if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
  });

  const dlg=document.getElementById('contact');
  document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>dlg.showModal());
  dlg.querySelector('[data-close]').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
